<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Phim</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="page-header py-4 mb-4"><div class="container">
      <h1 class="h3 mb-1"><i class="bi bi-film text-danger"></i> Phim</h1>
      <p class="mb-0 text-body-secondary">Chọn phim bạn muốn xem để đặt vé.</p>
    </div></div>
    <div class="container pb-5">
      <div class="row g-2 align-items-center mb-4">
        <div class="col-12 col-lg-auto"><ul class="nav nav-pills nav-pills-cine" id="movieTabs">
          <li class="nav-item"><button class="nav-link active" type="button" data-state="showing">Đang chiếu</button></li>
          <li class="nav-item"><button class="nav-link" type="button" data-state="coming">Sắp chiếu</button></li>
        </ul></div>
        <div class="col-6 col-lg-3 ms-lg-auto"><label for="genreFilter" class="visually-hidden">Thể loại</label><select id="genreFilter" class="form-select"><option value="">Tất cả thể loại</option></select></div>
        <div class="col-6 col-lg-3"><label for="searchInput" class="visually-hidden">Tìm phim</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input type="search" id="searchInput" class="form-control" placeholder="Tìm phim..."></div></div>
      </div>
      <div class="text-body-secondary small mb-3" id="movieCount">Đang tải...</div>
      <div class="row g-3 g-md-4" id="movieGrid"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/movies.js"></script>
</body>
</html>
