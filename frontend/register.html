<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Đăng ký</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3 text-center"><i class="bi bi-person-plus text-danger"></i> Đăng ký tài khoản</h1>
      <form id="registerForm" novalidate>
        <div class="mb-3"><label for="full_name" class="form-label">Họ và tên <span class="text-danger">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="" autocomplete="name"><div class="invalid-feedback"></div></div>
        <div class="row"><div class="col-md-6"><div class="mb-3"><label for="username" class="form-label">Tên đăng nhập <span class="text-danger">*</span></label>
          <input type="text" id="username" name="username" class="form-control" placeholder="" autocomplete="username"><div class="invalid-feedback"></div></div></div>
        <div class="col-md-6"><div class="mb-3"><label for="phone" class="form-label">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="0912345678" ><div class="invalid-feedback"></div></div></div></div>
        <div class="mb-3"><label for="email" class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="" autocomplete="email"><div class="invalid-feedback"></div></div>
        <div class="row"><div class="col-md-6"><div class="mb-3"><label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="" autocomplete="new-password"><div class="invalid-feedback"></div></div></div>
        <div class="col-md-6"><div class="mb-3"><label for="confirm" class="form-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
          <input type="password" id="confirm" name="confirm" class="form-control" placeholder="" autocomplete="new-password"><div class="invalid-feedback"></div></div></div></div>
        <div class="form-text mb-3">Mật khẩu tối thiểu 6 ký tự, gồm cả chữ và số.</div>
        <button type="submit" class="btn btn-cine w-100">Đăng ký</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Đã có tài khoản? <a href="login.html">Đăng nhập</a></p>
    </div></div>
  </div></div></main>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
