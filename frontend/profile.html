<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Tài khoản</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="page-header py-4 mb-4"><div class="container">
      <h1 class="h3 mb-1"><i class="bi bi-person-gear text-danger"></i> Tài khoản của tôi</h1>
      <p class="mb-0 text-body-secondary">Xem vé đã đặt, cập nhật thông tin cá nhân và đổi mật khẩu.</p>
    </div></div>
    <div class="container pb-5">
      <section id="tickets" class="mb-5" aria-labelledby="ticketsTitle">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h4 section-title mb-0" id="ticketsTitle">Vé của tôi</h2>
          <ul class="nav nav-pills nav-pills-cine" id="ticketTabs">
            <li class="nav-item"><button class="nav-link active" type="button" data-tab="upcoming">Sắp xem</button></li>
            <li class="nav-item"><button class="nav-link" type="button" data-tab="past">Đã xem</button></li>
          </ul>
        </div>
        <div class="row g-3" id="ticketList"><div class="col-12 text-center py-4"><div class="spinner-border text-danger" role="status"><span class="visually-hidden">Đang tải...</span></div></div></div>
      </section>
      <div class="row g-4">
        <div class="col-12 col-lg-6"><div class="card h-100"><div class="card-body">
          <h2 class="h5 mb-3">Thông tin cá nhân</h2>
          <p class="small text-body-secondary">Tên đăng nhập: <strong id="pUsername"></strong> &middot; Vai trò: <strong id="pRole"></strong></p>
          <form id="profileForm" novalidate>
            <div class="mb-3"><label for="full_name" class="form-label">Họ và tên <span class="text-danger">*</span></label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="" ><div class="invalid-feedback"></div></div>
            <div class="mb-3"><label for="email" class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="" ><div class="invalid-feedback"></div></div>
            <div class="mb-3"><label for="phone" class="form-label">Số điện thoại</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="0912345678" ><div class="invalid-feedback"></div></div>
            <button type="submit" class="btn btn-cine"><i class="bi bi-save"></i> Lưu thay đổi</button>
          </form>
        </div></div></div>
        <div class="col-12 col-lg-6"><div class="card h-100"><div class="card-body">
          <h2 class="h5 mb-3">Đổi mật khẩu</h2>
          <form id="passwordForm" novalidate>
            <div class="mb-3"><label for="current_password" class="form-label">Mật khẩu hiện tại <span class="text-danger">*</span></label>
          <input type="password" id="current_password" name="current_password" class="form-control" placeholder="" autocomplete="current-password"><div class="invalid-feedback"></div></div>
            <div class="mb-3"><label for="new_password" class="form-label">Mật khẩu mới <span class="text-danger">*</span></label>
          <input type="password" id="new_password" name="new_password" class="form-control" placeholder="" autocomplete="new-password"><div class="invalid-feedback"></div></div>
            <div class="mb-3"><label for="confirm" class="form-label">Nhập lại mật khẩu mới <span class="text-danger">*</span></label>
          <input type="password" id="confirm" name="confirm" class="form-control" placeholder="" autocomplete="new-password"><div class="invalid-feedback"></div></div>
            <button type="submit" class="btn btn-outline-danger"><i class="bi bi-key"></i> Đổi mật khẩu</button>
          </form>
        </div></div></div>
      </div>
    </div>
  </main>
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title text-danger" id="confirmTitle"><i class="bi bi-exclamation-triangle-fill"></i> Xác nhận</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button></div>
      <div class="modal-body" id="confirmMessage"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
        <button type="button" class="btn btn-danger" id="btnConfirmYes">Đồng ý</button></div>
    </div></div>
  </div>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
