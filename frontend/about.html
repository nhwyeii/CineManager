<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Thống kê & Liên hệ</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="page-header py-4 mb-4"><div class="container">
      <h1 class="h3 mb-1"><i class="bi bi-bar-chart-line text-danger"></i> Thống kê &amp; Liên hệ</h1>
      <p class="mb-0 text-body-secondary">Tổng hợp dữ liệu từ cơ sở dữ liệu và gửi góp ý cho rạp.</p>
    </div></div>
    <div class="container pb-5">
      <div id="statsSection" class="d-none">
      <div class="row g-3 text-center mb-4">
        <div class="col-6 col-md "><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-collection-play text-primary fs-2"></i><div class="stat-number mt-2" id="statTotal">0</div><div class="text-body-secondary">Tổng suất chiếu</div></div></div></div><div class="col-6 col-md "><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-hourglass-split text-info fs-2"></i><div class="stat-number mt-2" id="statPending">0</div><div class="text-body-secondary">Sắp chiếu</div></div></div></div><div class="col-6 col-md "><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-check-circle-fill text-success fs-2"></i><div class="stat-number mt-2" id="statDone">0</div><div class="text-body-secondary">Đã chiếu</div></div></div></div><div class="col-6 col-md "><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-ticket-perforated text-danger fs-2"></i><div class="stat-number mt-2" id="statTickets">0</div><div class="text-body-secondary">Vé đã bán</div></div></div></div><div class="col-6 col-md "><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-film text-secondary fs-2"></i><div class="stat-number mt-2" id="statMovies">0</div><div class="text-body-secondary">Phim</div></div></div></div>
        <div class="col-12 col-md-12 d-none" id="revenueCol"><div class="card stat-card h-100"><div class="card-body"><i class="bi bi-cash-coin text-warning fs-2"></i><div class="stat-number mt-2" id="statRevenue">0</div><div class="text-body-secondary">Doanh thu</div></div></div></div>
      </div>
      <div class="card mb-4"><div class="card-body"><h2 class="h6 mb-3">Tỷ lệ suất chiếu đã hoàn thành</h2>
        <div class="progress" style="height:1.5rem" role="progressbar" aria-label="Tỷ lệ đã chiếu" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar bg-success" id="statProgress" style="width:0%">0%</div></div></div></div>
      <div class="row g-3 mb-5">
        <div class="col-12 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h6 mb-3">Số suất theo phòng</h2><div id="roomBars"></div></div></div></div>
        <div class="col-12 col-lg-4"><div class="card h-100"><div class="card-body"><h2 class="h6 mb-3">Phim bán chạy (số vé)</h2><div id="topBars"></div></div></div></div>
        <div class="col-12 col-lg-4"><div class="card h-100"><div class="card-body text-center"><h2 class="h6 mb-3">Theo trạng thái</h2><div class="chart-box"><canvas id="chartStatus"></canvas></div></div></div></div>
        <div class="col-12"><div class="card"><div class="card-body text-center"><h2 class="h6 mb-3">Số suất chiếu theo thể loại</h2><div class="chart-box" style="max-width:560px"><canvas id="chartGenre"></canvas></div></div></div></div>
      </div>
      </div>
      <div class="row justify-content-center d-none" id="contactSection"><div class="col-12 col-lg-8"><div class="card"><div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-envelope text-danger"></i> Liên hệ</h2>
        <form id="contactForm" novalidate>
          <div class="mb-3"><label for="name" class="form-label">Họ tên <span class="text-danger">*</span></label>
          <input type="text" id="name" name="name" class="form-control" placeholder="Nguyễn Văn A" ><div class="invalid-feedback"></div></div>
          <div class="mb-3"><label for="email" class="form-label">Email <span class="text-danger">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="ban@example.com" ><div class="invalid-feedback"></div></div>
          <div class="mb-3"><label for="message" class="form-label">Nội dung (tối thiểu 10 ký tự) <span class="text-danger">*</span></label><textarea id="message" name="message" class="form-control" rows="4"></textarea><div class="invalid-feedback"></div></div>
          <button type="submit" class="btn btn-cine"><i class="bi bi-send"></i> Gửi liên hệ</button>
        </form>
      </div></div></div></div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/about.js"></script>
</body>
</html>
