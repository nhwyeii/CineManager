<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập | CineManager</title>
  <script src="/validation.js" defer></script>
  <script src="/auth.js" defer></script>
</head>
<body>
  <main>
    <a href="/">Trang chủ</a>
    <h1>Đăng nhập</h1>

    <form data-api="dang-nhap">
      <p>
        <label>Tên đăng nhập
          <input name="ten_dang_nhap" autocomplete="username" maxlength="50" required>
        </label>
      </p>
      <p>
        <label>Mật khẩu
          <input name="mat_khau" type="password" autocomplete="current-password"
                 minlength="8" maxlength="128" required>
        </label>
      </p>
      <button type="submit">Đăng nhập</button>
    </form>

    <p id="thong-bao" role="status"></p>
    <a href="/register.html">Tạo tài khoản</a>
  </main>
</body>
</html>
