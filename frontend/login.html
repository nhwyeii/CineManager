<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Đăng nhập</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-5">
    <div class="card shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3 text-center"><i class="bi bi-box-arrow-in-right text-danger"></i> Đăng nhập</h1>
      <form id="loginForm" novalidate>
        <div class="mb-3"><label for="username" class="form-label">Tên đăng nhập hoặc email <span class="text-danger">*</span></label>
          <input type="text" id="username" name="username" class="form-control" placeholder="VD: khach" autocomplete="username"><div class="invalid-feedback"></div></div>
        <div class="mb-3"><label for="password" class="form-label">Mật khẩu <span class="text-danger">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="" autocomplete="current-password"><div class="invalid-feedback"></div></div>
        <button type="submit" class="btn btn-cine w-100">Đăng nhập</button>
      </form>
      <p class="text-center mt-3 mb-0 small">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
    </div></div>
  </div></div></main>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
