<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Lịch chiếu</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <div class="page-header py-4 mb-4"><div class="container">
      <h1 class="h3 mb-1"><i class="bi bi-calendar-week text-danger"></i> Lịch chiếu</h1>
      <p class="mb-0 text-body-secondary">Chọn ngày, chọn suất chiếu rồi chọn ghế ngồi.</p>
    </div></div>
    <div class="container pb-5">
      <div class="date-strip mb-3" id="dateStrip" role="group" aria-label="Chọn ngày chiếu"></div>
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-8"><label for="searchInput" class="visually-hidden">Tìm phim</label><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input type="search" id="searchInput" class="form-control" placeholder="Tìm theo tên phim, thể loại..."></div></div>
        <div class="col-12 col-md-4"><label for="filterRoom" class="visually-hidden">Phòng chiếu</label><select id="filterRoom" class="form-select"><option value="all">Tất cả phòng</option></select></div>
      </div>
      <div class="text-body-secondary small mb-2" id="showCount">Đang tải...</div>
      <div class="card"><div class="card-body py-0" id="showList"></div></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/showtimes.js"></script>
</body>
</html>
