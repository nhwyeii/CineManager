<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineManager - Đặt vé xem phim trực tuyến</title>
  <script src="assets/js/theme.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main>
    <!-- Banner phim nổi bật -->
    <section aria-label="Phim nổi bật"><div id="heroCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="6000">
      <div class="carousel-indicators" id="heroDots"></div>
      <div class="carousel-inner" id="heroSlides"><div class="carousel-item active"><div class="hero-slide hero-empty"><div class="container text-center"><div class="spinner-border text-danger" role="status"><span class="visually-hidden">Đang tải...</span></div></div></div></div></div>
      <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon" aria-hidden="true"></span><span class="visually-hidden">Phim trước</span></button>
      <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next"><span class="carousel-control-next-icon" aria-hidden="true"></span><span class="visually-hidden">Phim sau</span></button>
    </div></section>

    <!-- Mua vé nhanh -->
    <section class="container"><form class="quick-book p-3 p-md-4" id="quickForm" novalidate>
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-3"><label class="form-label" for="qMovie">1. Chọn phim</label><select id="qMovie" class="form-select"><option value="">-- Chọn phim --</option></select></div>
        <div class="col-6 col-md-3"><label class="form-label" for="qDate">2. Chọn ngày</label><select id="qDate" class="form-select" disabled><option value="">-- Chọn ngày --</option></select></div>
        <div class="col-6 col-md-3"><label class="form-label" for="qShow">3. Chọn suất</label><select id="qShow" class="form-select" disabled><option value="">-- Chọn suất --</option></select></div>
        <div class="col-12 col-md-3 d-grid"><button type="submit" class="btn btn-cine btn-lg" id="qGo" disabled><i class="bi bi-ticket-perforated"></i> Mua vé ngay</button></div>
      </div>
    </form></section>

    <!-- Danh sách phim -->
    <section class="container my-5">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <h2 class="h4 section-title mb-0">Phim</h2>
        <ul class="nav nav-pills nav-pills-cine" id="movieTabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" type="button" data-state="showing">Đang chiếu</button></li>
          <li class="nav-item"><button class="nav-link" type="button" data-state="coming">Sắp chiếu</button></li>
        </ul>
        <a href="movies.html" class="btn btn-sm btn-outline-danger" id="seeAll">Xem tất cả</a>
      </div>
      <div class="row g-3 g-md-4" id="movieGrid"></div>
    </section>

    <!-- 3 bước đặt vé -->
    <section class="container mb-5">
      <h2 class="h4 section-title mb-4">Đặt vé chỉ trong 3 bước</h2>
      <div class="row g-4 text-center">
        <div class="col-12 col-md-4"><span class="step-icon"><i class="bi bi-film"></i></span><h3 class="h6 mt-3">1. Chọn phim &amp; suất chiếu</h3><p class="small text-body-secondary mb-0">Xem phim đang chiếu, chọn ngày và giờ phù hợp.</p></div>
        <div class="col-12 col-md-4"><span class="step-icon"><i class="bi bi-grid-3x3-gap-fill"></i></span><h3 class="h6 mt-3">2. Chọn ghế ngồi</h3><p class="small text-body-secondary mb-0">Chọn đúng vị trí yêu thích trên sơ đồ phòng chiếu.</p></div>
        <div class="col-12 col-md-4"><span class="step-icon"><i class="bi bi-qr-code"></i></span><h3 class="h6 mt-3">3. Nhận mã vé</h3><p class="small text-body-secondary mb-0">Xem lại vé trong mục &ldquo;Vé của tôi&rdquo; và đưa mã vé khi vào rạp.</p></div>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/validation.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
